<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101113"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D8D8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <circle cx="128" cy="126" r="98" fill="url(#disc)" stroke="#404040" stroke-width="2"/>

  <!-- gauge track: 270° sweep, gap at the bottom -->
  <circle cx="128" cy="130" r="67" fill="none" stroke="#1A1A1C"
          stroke-width="14" stroke-linecap="round"
          stroke-dasharray="315.73 105.24"
          transform="rotate(135 128 130)"/>

  <!-- amber progress arc -->
  <circle cx="128" cy="130" r="67" fill="none" stroke="url(#arc)"
          stroke-width="14" stroke-linecap="round"
          stroke-dasharray="220 220.97"
          transform="rotate(135 128 130)"/>

  <!-- needle and hub -->
  <line x1="128" y1="130" x2="169" y2="89" stroke="#FFFFFF"
        stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="130" r="12" fill="#FFFFFF"/>
  <circle cx="128" cy="130" r="5" fill="#14100A"/>

  <!-- completion bead -->
  <circle cx="175" cy="177" r="6" fill="#66B366"/>
</svg>
